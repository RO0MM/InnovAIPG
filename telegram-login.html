<!DOCTYPE html>

<html lang="es">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Vincular Telegram — Innov IA</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="css/telegram-login.css" rel="stylesheet"/>
<meta content="noindex,nofollow,noarchive" name="robots"/>
</head>
<body>
<div class="card">
<div class="logo">IA</div>
<h1>Vincular Telegram</h1>
<p>
      Ingresa con el mismo correo y contraseña que usas en el panel administrador.
    </p>
<label for="email">Correo administrador</label>
<input autocomplete="email" id="email" placeholder="admin@correo.com" type="email"/>
<label for="password">Contraseña</label>
<input autocomplete="current-password" id="password" placeholder="••••••••" type="password"/>
<button id="btnLogin">Iniciar sesión y vincular</button>
<div class="msg" id="msg"></div>
<div class="note">
      No escribas tu contraseña dentro del chat de Telegram.
      El login se valida aquí con Supabase.
    </div>
</div>
<script src="js/telegram-login.js"></script>
</body>
</html>
